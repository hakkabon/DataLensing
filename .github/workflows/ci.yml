# CI: SPM build + tests everywhere the package claims to run, plus the
# Xcode viewer where Xcode exists (macOS run + iOS simulator compile).
# Linux proves the Foundation-only targets (and the canImport-gated
# chart view) stay portable.

name: CI

on:
  push:
  pull_request:

jobs:
  spm-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          test -n "$XCODE" || { echo "no Xcode 16 on runner"; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Build (debug)
        run: swift build
      - name: Test (debug)
        run: swift test
      - name: Build viewer
        run: >
          xcodebuild -project Viewer/DataLensingViewer.xcodeproj
          -scheme DataLensingViewer -configuration Debug build

  viewer-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          test -n "$XCODE" || { echo "no Xcode 16 on runner"; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      # Simulator compile only (no signing identity on runners): keeps
      # the iOS destination from rotting. Running needs a device.
      # ARCHS=arm64: the generic destination builds universal binaries,
      # but upstream's Rust FFI xcframework ships no x86_64-simulator
      # slice — the x86_64 link fails on missing _ffi_/_uniffi_ symbols.
      # Our Swift is arch-independent, so arm64-only still proves iOS
      # compile coverage. (Upstream could close this by adding the
      # ios-x86_64-simulator slice; same reason Intel Macs can't link
      # simulator builds locally.)
      - name: Build viewer for iOS Simulator
        run: >
          xcodebuild -project Viewer/DataLensingViewer.xcodeproj
          -scheme DataLensingViewer -configuration Debug
          -destination 'generic/platform=iOS Simulator' ARCHS=arm64 build
          CODE_SIGNING_ALLOWED=NO

  spm-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Build (debug)
        run: swift build
      - name: Test (debug)
        run: swift test
